
name: Publicar PWA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm install

      - name: Verificar bibliotecas
        run: |
          test -f node_modules/html2pdf.js/dist/html2pdf.bundle.min.js
          test -f node_modules/docx/dist/index.iife.js

      - name: Preparar bibliotecas PDF e Word
        run: |
          mkdir -p www/lib

          cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/lib/html2pdf.js
          cp node_modules/docx/dist/index.iife.js www/lib/docx.js

          echo "Bibliotecas copiadas com sucesso!"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar PWA
        id: deployment
        uses: actions/deploy-pages@v4
