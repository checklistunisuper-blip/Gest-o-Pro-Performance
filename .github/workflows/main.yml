# Super Pro Performance - gera o APK de teste pelo GitHub
# Caminho no repositorio: .github/workflows/main.yml
name: Gerar APK

on:
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    branches: [main]        # tambem roda quando voce atualiza os arquivos

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icones e tela de abertura
        run: npx capacitor-assets generate --android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar APK de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: super-pro-performance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
